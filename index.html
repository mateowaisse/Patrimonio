<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Patrimonio">
<meta name="robots" content="noindex, nofollow">
<title>Patrimonio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15171c;--card:#1d2027;--card2:#23262e;--line:#2a2d35;--tx:#e8e6e1;--tx2:#b5b3ad;--mut:#8a8d95;--mut2:#6b6e76;
  --gold:#d9b779;--gold-d:#a88b55;--up:#7fb89a;--dn:#cf8b83;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --r:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:15px/1.45 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:560px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin:4px 0 22px}
.hi{font-size:16px;font-weight:500}
.sub{font-size:12px;color:var(--mut)}
.icons{display:flex;gap:4px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
.ib:active{background:var(--card)}
.ib svg{width:20px;height:20px}
.ib.on{color:var(--gold)}

.total-l{font-size:13px;color:var(--mut)}
.total{font-family:var(--serif);font-weight:400;font-size:clamp(36px,11vw,46px);line-height:1.05;color:var(--gold);letter-spacing:-.5px;margin:2px 0 4px;display:block;text-align:left}
.total-s{font-size:13px;color:var(--mut);margin-bottom:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{font-size:12px;padding:3px 10px;border-radius:999px;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--tx)}

.card{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.card h3{font:500 13px var(--sans);color:var(--mut);margin:0 0 10px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.row+.row{margin-top:6px}
.hr{height:1px;background:var(--line);margin:12px 0}
.up{color:var(--up)}.dn{color:var(--dn)}.gold{color:var(--gold)}.m{color:var(--mut)}.t2{color:var(--tx2)}
.big{font-size:18px;font-weight:500}
.note{font-size:13px;color:var(--mut);line-height:1.55;margin-top:12px}
.aviso{border-left:2px solid var(--gold);background:var(--card2)}
.aviso p{margin:0 0 10px;font-size:14px}
.lnk{color:var(--gold);font-size:13px;font-weight:500}
.fx{font-size:12px;color:var(--mut2);text-align:center;margin:18px 0 6px}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.list .it:first-child{border-top:0}
.it .n{font-size:14px}
.it .s{font-size:12px;color:var(--mut)}
.it .r{text-align:right;flex-shrink:0}
.it .r .v{font-size:14px}
.it .r .s{font-size:12px}

.h1{font-family:var(--serif);font-weight:400;font-size:30px;margin:6px 0 16px;letter-spacing:-.3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.chip.on{border-color:var(--gold-d);color:var(--gold)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:4px 0 14px;gap:2px}
.bar span{display:block;height:100%}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.grid2 .card{margin:0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.kv div span{display:block;font-size:12px;color:var(--mut)}
.kv div b{font-weight:500;font-size:15px}
.month{font-size:13px;color:var(--gold);margin:16px 0 4px;font-weight:500}
.month:first-child{margin-top:0}
.empty{text-align:center;color:var(--mut);padding:36px 12px;font-size:14px}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mut);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:3px;margin-right:6px}

/* navegación */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(21,23,28,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around;align-items:center;height:62px}
nav .tb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);min-width:58px}
nav .tb svg{width:21px;height:21px}
nav .tb.on{color:var(--gold)}
nav .plus{width:48px;height:48px;border-radius:50%;background:var(--gold);color:#15171c;display:grid;place-items:center;margin-top:-6px}
nav .plus svg{width:24px;height:24px}

/* hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;transform:translateY(100%);transition:transform .25s ease;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet{visibility:hidden}.sheet.open{transform:none;visibility:visible}
.sheet .in{max-width:560px;margin:0 auto}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sh-t{font-family:var(--serif);font-size:24px;margin:0 0 4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{background:var(--card2);border-radius:var(--r);padding:16px 14px;text-align:left;min-height:84px}
.opt b{display:block;font-weight:500;font-size:15px;margin-bottom:2px}
.opt span{font-size:12px;color:var(--mut)}
.field{margin:14px 0}
.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 12px;font-size:16px}
.field input:focus,.field select:focus{border-color:var(--gold-d);outline:none}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.btn{display:block;width:100%;background:var(--gold);color:#15171c;border-radius:12px;padding:14px;font-weight:600;font-size:15px;margin-top:16px;text-align:center}
.btn.sec{background:var(--card2);color:var(--tx)}
.btn:disabled{opacity:.5}
.pick{display:block;width:100%;text-align:left;background:var(--card2);border-radius:12px;padding:12px 14px;margin-top:8px;border:1px solid transparent}
.pick.on{border-color:var(--gold-d)}
.pick b{font-weight:500}
.pick span{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.err{color:var(--dn);font-size:13px;margin-top:10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;z-index:60;display:flex;gap:14px;align-items:center;max-width:92vw}
.center{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:0 auto;padding:24px}
.center .h1{font-size:38px;color:var(--gold);margin-bottom:6px}
.pin{display:flex;gap:12px;justify-content:center;margin:26px 0}
.pin i{width:14px;height:14px;border-radius:50%;border:1px solid var(--mut)}
.pin i.f{background:var(--gold);border-color:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.pad button{height:72px;border-radius:50%;background:var(--card);font-size:24px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.demo{font-size:12px;color:var(--gold);border:1px solid var(--gold-d);border-radius:999px;padding:2px 8px;margin-left:8px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" hidden><div class="in">
  <button class="tb" data-tab="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoy</button>
  <button class="tb" data-tab="cartera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Cartera</button>
  <button class="plus" id="plus" aria-label="Registrar movimiento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tb" data-tab="bonos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Bonos</button>
  <button class="tb" data-tab="evolucion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Evolución</button>
</div></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="in"><div class="grab"></div><div id="sheetBody"></div></div></div>

<script>
'use strict';
/* ================= Estado ================= */
const LS = 'pat_';
const load = k => { try { return JSON.parse(localStorage.getItem(LS + k)); } catch (e) { return null; } };
const save = (k, v) => { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) {} };
const S = {
  cfg: load('cfg'), dash: load('dash'), lock: load('lock'), ocultar: !!load('ocultar'),
  moneda: load('moneda') || 'USD', tab: 'hoy', avisos: [], activos: null, demo: !!load('demo'),
  cartGrupo: 'banco', cartOrden: 'valor', evoPeriodo: '3M', evo: null, cargando: false, error: null
};
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ================= Formato ================= */
const NF = {};
const nf = d => NF[d] || (NF[d] = new Intl.NumberFormat('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d }));
const fxRef = () => { const d = S.dash; if (!d) return 0; return d.fx.referencia === 'CCL' ? d.fx.ccl : d.fx.mep; };
function money(usd, o = {}) {
  if (S.ocultar) return '•••••';
  if (usd == null || isNaN(usd)) return '—';
  const ars = o.pesos || (o.moneda || S.moneda) === 'ARS';
  const v = o.pesos ? usd : ars ? usd * fxRef() : usd;
  const sg = o.signo && v > 0.5 ? '+' : v < -0.5 ? '−' : '';
  return sg + (ars ? '$ ' : 'US$ ') + nf(0).format(Math.abs(v));
}
const pct = (v, signo = true) => v == null || isNaN(v) ? '—' : (signo && v > 0 ? '+' : v < 0 ? '−' : '') + nf(2).format(Math.abs(v)) + '%';
const cls = v => v > 0 ? 'up' : v < 0 ? 'dn' : '';
const tapar = t => S.ocultar ? String(t).replace(/(US\$|\$)\s?[\d.,]+/g, '•••••') : t;
const qty = (v, d = 2) => S.ocultar ? '•••' : nf(Math.abs(v) >= 1000 || Math.abs(v - Math.round(v)) < 1e-9 ? 0 : d).format(v);
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fecha = s => { if (!s) return '—'; const [y, m, d] = s.slice(0, 10).split('-'); return +d + ' ' + MESES[+m - 1].slice(0, 3) + ' ' + y; };
const fechaCorta = s => { const [, m, d] = s.slice(0, 10).split('-'); return +d + ' ' + MESES[+m - 1].slice(0, 3); };
function hace(iso) {
  if (!iso) return '';
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return 'recién';
  if (min < 60) return 'hace ' + min + ' min';
  const h = Math.round(min / 60);
  return h < 24 ? 'hace ' + h + ' h' : 'hace ' + Math.round(h / 24) + ' días';
}
const hoyISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const TIPOS = { ACCION: 'Acciones', CEDEAR: 'CEDEARs', BONO: 'Bonos', FCI: 'Fondos', CASH: 'Cuentas', PLAZO_FIJO: 'Plazo fijo', ORO: 'Oro', EFECTIVO: 'Efectivo', OTRO: 'Otros' };
const CASH = ['CASH', 'EFECTIVO', 'PLAZO_FIJO'];
const PALETA = ['#d9b779', '#7fa6b8', '#9bb89a', '#b8927f', '#a99bc4', '#c4b99b', '#6f8f8a', '#8a8d95'];

/* ================= API ================= */
// Todo va por POST con la clave en el cuerpo, nunca en la URL (text/plain: sin preflight CORS)
async function llamar(action, data, ms) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(S.cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: S.cfg.key, action, data }), signal: ctl.signal });
    const j = await r.json();
    if (j && j.error) throw new Error(j.error === 'no autorizado' ? 'La clave no es válida.' : j.error);
    return j;
  } catch (e) {
    throw e.name === 'AbortError' ? new Error('El servidor tardó demasiado. Probá de nuevo.') : e;
  } finally { clearTimeout(t); }
}
async function get(action, params = {}) {
  if (S.demo) return DEMO.get(action, params);
  return llamar(action, params, 30000);
}
async function post(action, data) {
  if (S.demo) return DEMO.post(action, data);
  return llamar(action, data, 60000);
}

async function refrescar(silencioso) {
  if (S.cargando) return;
  S.cargando = true; S.error = null;
  if (!silencioso) render();
  try {
    const [d, av] = await Promise.all([get('dashboard'), get('avisos').catch(() => [])]);
    S.dash = d; S.avisos = av || [];
    if (!S.demo) save('dash', d);
    S.evo = null;
  } catch (e) {
    S.error = e.name === 'AbortError' ? 'El servidor tardó demasiado. Probá de nuevo.' : (e.message || 'No se pudo actualizar.');
  }
  S.cargando = false;
  render();
}

/* ================= Iconos ================= */
const IC = {
  ojo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  ojoNo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
  rec: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>',
  aj: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h16v11H9l-5 4z"/></svg>'
};
const ASISTENTE_ACTIVO = false;   // lugar reservado para el asistente

function topbar(titulo) {
  return `<div class="top"><div>${titulo}</div><div class="icons">
    ${ASISTENTE_ACTIVO ? `<button class="ib" aria-label="Asistente">${IC.chat}</button>` : ''}
    <button class="ib ${S.ocultar ? 'on' : ''}" data-act="ocultar" aria-label="${S.ocultar ? 'Mostrar montos' : 'Ocultar montos'}">${S.ocultar ? IC.ojoNo : IC.ojo}</button>
    <button class="ib" data-act="refrescar" aria-label="Actualizar">${S.cargando ? '<span class="spin"></span>' : IC.rec}</button>
    <button class="ib" data-act="ajustes" aria-label="Ajustes">${IC.aj}</button></div></div>`;
}

/* ================= Pantalla: Hoy ================= */
/** Variación del día en la moneda elegida. En pesos la calcula el backend: la suba del dólar suma. */
function diaEn(d) {
  const a = S.moneda === 'ARS' && d.total.diaArs;
  if (a) return { ars: true, v: a.varDia, pct: a.varDiaPct, precio: a.efectoPrecio, fx: a.efectoFx, m: { pesos: true, signo: true } };
  const t = d.total;
  return { ars: false, v: t.varDiaUsd, pct: t.varDiaPct, precio: t.efectoPrecioUsd, fx: t.efectoFxUsd, m: { moneda: 'USD', signo: true } };
}
function textoDelDia(d, dia) {
  const v = dia.v;
  if (Math.abs(dia.pct) < 0.05) return 'Día tranquilo: tu patrimonio casi no se movió.';
  let s = (v > 0 ? 'Subiste ' : 'Bajaste ') + pct(Math.abs(dia.pct), false) + (dia.ars ? ' en pesos. ' : '. ');
  const m = (d.movers || [])[0];
  const mv = m ? m.varDiaUsd * (dia.ars ? fxRef() : 1) : 0;
  if (m && Math.abs(mv) > Math.abs(v) * 0.25) s += 'Lo que más pesó fue ' + m.nombre + (mv * v > 0 ? '' : ', en sentido contrario') + '. ';
  if (Math.abs(dia.fx) > Math.abs(v) * 0.3) s += dia.ars
    ? 'El dólar ' + (dia.fx > 0 ? 'subió y sumó' : 'bajó y restó') + ' en lo que tenés en dólares.'
    : 'El dólar ' + (dia.fx < 0 ? 'subió y restó' : 'bajó y sumó') + ' en tu parte en pesos.';
  return s.trim();
}
function vHoy() {
  const d = S.dash;
  const otra = S.moneda === 'USD' ? money(d.total.usd, { moneda: 'ARS' }) : money(d.total.usd, { moneda: 'USD' });
  const nuevos = S.avisos.filter(a => !a.leido);
  const prox = (d.cobros || [])[0];
  const alertas = (d.alertas || []).filter(a => a.tipo !== 'cobro');
  const dia = diaEn(d);
  return topbar(`<div class="hi">Hola, ${esc(d.nombre || '')}${S.demo ? '<span class="demo">ejemplo</span>' : ''}</div>
      <div class="sub">${S.error ? '<span class="dn">' + esc(S.error) + '</span>' : 'Actualizado ' + hace(d.generado)}</div>`) + `
  <div class="total-l">Patrimonio total</div>
  <button class="total" data-act="moneda" aria-label="Cambiar moneda">${money(d.total.usd)}</button>
  <div class="total-s"><span>${otra} · ${d.fx.referencia}</span>
    <span class="seg"><button class="${S.moneda === 'USD' ? 'on' : ''}" data-mon="USD">USD</button><button class="${S.moneda === 'ARS' ? 'on' : ''}" data-mon="ARS">ARS</button></span></div>

  ${nuevos.map(a => `<div class="card aviso"><p>${esc(tapar(a.texto))}</p><button class="lnk" data-act="leidos">Entendido</button></div>`).join('')}

  <div class="card">

/* ================= Pantalla: Evolución ================= */
function vEvolucion() {
  const d = S.dash;
  const head = topbar('<div class="h1" style="margin:0">Evolución</div>');
  if (!S.evo) { cargarEvo(); return head + '<div class="empty"><span class="spin"></span></div>'; }
  const dias = { '1M': 30, '3M': 91, '1A': 365, 'Todo': 1e5 }[S.evoPeriodo];
  const desde = new Date(Date.now() - dias * 864e5).toISOString().slice(0, 10);
  let s = S.evo.serie.filter(x => x.fecha >= desde);
  const chips = `<div class="chips">${['1M', '3M', '1A', 'Todo'].map(p => `<button class="chip ${S.evoPeriodo === p ? 'on' : ''}" data-per="${p}">${p === '1A' ? '1 año' : p === 'Todo' ? 'Desde el inicio' : p.replace('M', ' meses').replace('1 meses', '1 mes')}</button>`).join('')}</div>`;
  const r = S.evo.rendimiento || {};
  const tarjetas = `<div class="grid2">
    <div class="card"><h3>Último mes</h3><div class="big ${cls(r.d30)}">${pct(r.d30)}</div></div>
    <div class="card"><h3>En el año</h3><div class="big ${cls(r.ytd)}">${pct(r.ytd)}</div></div></div>
    <div class="card"><h3>De dónde sale tu patrimonio</h3>
      <div class="row"><span class="t2">Lo que aportaste</span><span>${money(S.evo.aportesNetosUsd)}</span></div>
      <div class="row"><span class="t2">Lo que ganaste</span><span class="${cls(S.evo.resultadoUsd)}">${money(S.evo.resultadoUsd, { signo: true })}</span></div>
      <div class="note">El rendimiento no cuenta la plata que agregaste o sacaste: mide solo cómo rindió lo invertido${r.inicio != null ? '. Desde el inicio: <span class="' + cls(r.inicio) + '">' + pct(r.inicio) + '</span>' : ''}.</div></div>`;
  if (s.length < 2) return head + chips + `<div class="card empty">La evolución se arma con una foto de tu patrimonio por día. En unos días vas a ver el gráfico acá.</div>` + tarjetas;

  const base = s[0], sp0 = (s.find(x => x.spx) || {}).spx;
  const cart = s.map(x => (x.cartera / base.cartera - 1) * 100);
  const spx = sp0 ? s.map(x => x.spx ? (x.spx / sp0 - 1) * 100 : null) : [];
  const mepVar = base.mep && s[s.length - 1].mep ? (s[s.length - 1].mep / base.mep - 1) * 100 : null;
  const W = 340, H = 180, P = { l: 36, r: 8, t: 10, b: 22 };
  const vals = cart.concat(spx.filter(v => v != null));
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  const pad = (hi - lo) * 0.1 || 1; lo -= pad; hi += pad;
  const X = i => P.l + i * (W - P.l - P.r) / (s.length - 1);
  const Y = v => P.t + (hi - v) * (H - P.t - P.b) / (hi - lo);
  const path = arr => arr.map((v, i) => v == null ? '' : (i && arr[i - 1] != null ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
  const ticks = [lo + pad, 0, hi - pad].filter((v, i, a) => a.indexOf(v) === i);
  const svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rendimiento de la cartera comparado con el S&P 500">
    ${ticks.map(t => `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="#2a2d35" ${t === 0 ? '' : 'stroke-dasharray="2 4"'}/>
      <text x="${P.l - 6}" y="${Y(t) + 4}" fill="#6b6e76" font-size="10" text-anchor="end">${nf(1).format(t)}%</text>`).join('')}
    <text x="${P.l}" y="${H - 4}" fill="#6b6e76" font-size="10">${fechaCorta(s[0].fecha)}</text>
    <text x="${W - P.r}" y="${H - 4}" fill="#6b6e76" font-size="10" text-anchor="end">${fechaCorta(s[s.length - 1].fecha)}</text>
    ${spx.length ? `<path d="${path(spx)}" fill="none" stroke="#7fa6b8" stroke-width="1.5"/>` : ''}
    <path d="${path(cart)}" fill="none" stroke="#d9b779" stroke-width="2"/></svg>`;
  return head + chips + `<div class="card">
    <div class="row"><span class="m" style="font-size:13px">Tu cartera en el período${S.moneda === 'ARS' ? ' (en dólares)' : ''}</span><span class="big ${cls(cart[cart.length - 1])}">${pct(cart[cart.length - 1])}</span></div>
    ${svg}
    <div class="legend"><span><i style="background:#d9b779"></i>Tu cartera ${pct(cart[cart.length - 1])}</span>
    ${spx.length ? `<span><i style="background:#7fa6b8"></i>S&P 500 ${pct(spx[spx.length - 1])}</span>` : ''}</div>
    ${mepVar != null ? `<div class="note">En el mismo período el dólar MEP ${mepVar >= 0 ? 'subió' : 'bajó'} ${pct(Math.abs(mepVar), false)} contra el peso.</div>` : ''}
  </div>` + tarjetas;
}
async function cargarEvo() {
  if (S._evoCargando) return;
  S._evoCargando = true;
  try { S.evo = await get('evolucion'); } catch (e) { S.evo = { serie: [], rendimiento: S.dash.rendimiento, aportesNetosUsd: S.dash.total.aportesNetosUsd, resultadoUsd: S.dash.total.resultadoUsd }; }
  S._evoCargando = false;
  if (S.tab === 'evolucion') render();
}

function toast(txt, deshacerId) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span>${esc(txt)}</span>${deshacerId ? '<button class="lnk">Deshacer</button>' : ''}`;
  document.body.appendChild(el);
  if (deshacerId) el.querySelector('button').onclick = async () => {
    el.remove();
    try { await post('borrarMovimiento', { id: deshacerId }); toast('Movimiento deshecho'); refrescar(true); } catch (e) { toast(e.message); }
  };
  setTimeout(() => el.remove(), deshacerId ? 8000 : 3000);
}

const num = v => { const n = parseFloat(String(v || '').replace(/\./g, '').replace(',', '.')); return isFinite(n) ? n : NaN; };

  if (/,/.test(s)) return num(s);
  if (/^\d{1,3}(\.\d{3})+$/.test(s)) return parseFloat(s.replace(/\./g, ''));
  return parseFloat(s); };

function selectCuenta(banco, moneda, conAporte, etiqueta) {
  const cs = cuentas().slice().sort((a, b) => ((b.banco === banco) - (a.banco === banco)) || ((b.moneda === moneda) - (a.moneda === moneda)));

async function buscar() {

/* ---------- Dólar del día: aparece solo si hay pesos en juego ---------- */
function campoTc() {
  return `<div class="field" id="ftcw" style="display:none"><label for="ftc">Dólar ${esc(S.dash.fx.referencia)} de ese día</label>
    <input id="ftc" inputmode="decimal" autocomplete="off"><div class="hint" id="ftch"></div></div>`;
}
function monedaCuenta() {
  const c = $('#fc') && $('#fc').value;
  if (c === '__nueva') return $('#nmo').value;
  return c ? (cuentas().find(x => x.id === c) || {}).moneda : null;
}
function hayPesos() {
  const f = S.flujo, mc = monedaCuenta();
  const mon = f.tipo === 'cobro' ? $('#fmo').value : f.tipo === 'caja' ? mc : f.moneda;
  return mon === 'ARS' || mc === 'ARS';
}
async function actualizarTc() {
  const w = $('#ftcw');
  if (!w) return;
  const on = hayPesos();
  w.style.display = on ? 'block' : 'none';
  const inp = $('#ftc'), h = $('#ftch');
  if (!on || inp.dataset.manual) return;
  const dia = $('#ff').value || hoyISO();
  w.dataset.pedido = dia;
  if (dia >= hoyISO()) { inp.value = nf(2).format(fxRef()); h.textContent = 'El de hoy. Cambialo si operaste a otro.'; return; }
  inp.value = ''; h.textContent = 'Buscando el dólar de esa fecha…';
  try {
    const r = await get('tc', { fecha: dia });
    if (w.dataset.pedido !== dia || inp.dataset.manual) return;
    if (r && r.tc) { inp.value = nf(2).format(r.tc); h.textContent = 'Cierre del ' + fecha(dia) + '. Cambialo si operaste a otro.'; }
    else h.textContent = 'No lo encontré: escribilo a mano.';
  } catch (e) { if (w.dataset.pedido === dia) h.textContent = 'No lo encontré: escribilo a mano.'; }
}
function enlazarTc() {
  ['#ff', '#fc', '#fmo', '#nmo'].forEach(q => { const el = $(q); if (el) el.addEventListener('change', actualizarTc); });
  $('#ftc').addEventListener('input', e => { e.target.dataset.manual = '1'; $('#ftch').textContent = ''; });
  // Un aviso viejo (p. ej. saldo negativo de otra cuenta) se borra al cambiar cualquier dato
  $('#sheetBody').oninput = $('#sheetBody').onchange = () => { const e = $('#ferr'); if (e) e.innerHTML = ''; };
  actualizarTc();
}
/** Saldo que le quedaría a una cuenta después de sacarle `salida` (en `monSalida`). */
function saldoTras(cuentaId, salida, monSalida, tc) {
  const cta = cuentas().find(x => x.id === cuentaId);
  if (!cta) return null;
  const p = S.dash.posiciones.find(x => x.id === cuentaId);
  const enCta = monSalida === cta.moneda ? salida : cta.moneda === 'ARS' ? salida * tc : salida / tc;
  return { cta, queda: (p ? p.cantidad : 0) - enCta };
}

async function guardar(btn) {
  const f = S.flujo, err = $('#ferr');
  btn.dataset.txt = btn.dataset.txt || btn.textContent;
  const fallo = m => { err.innerHTML = `<div class="err">${esc(m)}</div>`; btn.disabled = false; btn.textContent = btn.dataset.txt; };
  const forzar = f.forzar; f.forzar = false;
  // Si la cuenta queda en negativo se avisa; se puede guardar igual (puede faltar cargar su saldo)
  const negativa = (cuentaId, salida, mon) => {
    const r = !forzar && cuentaId && saldoTras(cuentaId, salida, mon, tc || fxRef());
    if (!r || r.queda > -0.5) return false;
    err.innerHTML = `<div class="err">${esc(r.cta.nombre)} quedaría en ${money(r.queda, r.cta.moneda === 'ARS' ? { pesos: true } : { moneda: 'USD' })}.
      Si todavía no cargaste su saldo, podés guardar igual.<br><button class="lnk" data-act="guardarIgual">Guardar igual</button></div>`;
    btn.disabled = false; btn.textContent = btn.dataset.txt;
    return true;
  };
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  const conPesos = hayPesos();
  const tc = conPesos ? numSuelto($('#ftc').value) : undefined;
  try {
    let activoId = f.id, mov;
    const fechaV = $('#ff').value || hoyISO();
    if (conPesos && !(tc > 0)) return fallo('Ingresá el dólar de ese día.');
    if (f.tipo === 'caja') {
      const monto = numSuelto($('#fm').value);
      if (!(monto > 0)) return fallo('Ingresá un monto mayor a cero.');
      let cuentaId = $('#fc').value, mon;
      if (cuentaId === '__nueva') {
        const nombre = $('#nn').value.trim(), banco = $('#nb').value.trim();
        if (!nombre || !banco) return fallo('Completá el nombre de la cuenta y el banco.');
        mon = $('#nmo').value;
        const r = await post('crearActivo', { banco, opcion: { nombre, tipo: $('#nt').value, fuente: 'FIJO', moneda: mon, ticker: '', divisor: 1 } });
        cuentaId = r.id; S.activos = null;
      } else {
        mon = (cuentas().find(c => c.id === cuentaId) || {}).moneda;
        if (f.caja === 'RETIRO' && negativa(cuentaId, monto, mon)) return;
      }
      mov = { tipo: f.caja, activo_id: cuentaId, cantidad: monto, precio: 1, moneda: mon, tc, fecha: fechaV };
    } else if (f.tipo === 'cobro') {
      const monto = numSuelto($('#fm').value);
      if (!(monto > 0)) return fallo('Ingresá el monto cobrado.');
      mov = { tipo: 'COBRO', activo_id: activoId, cantidad: monto, moneda: $('#fmo').value, tc, contra_activo: $('#fc').value || '', fecha: fechaV };
    } else {
      const cant = numSuelto($('#fq').value), precio = numSuelto($('#fp').value);
      if (!(cant > 0)) return fallo('Ingresá una cantidad mayor a cero.');
      if (!(precio > 0)) return fallo('Ingresá el precio.');
      const div = ((S.activos || []).find(a => a.id === activoId) || f.opcion || {}).divisor
        || ((S.dash.posiciones.find(x => x.id === activoId) || {}).tipo === 'BONO' ? 100 : 1);
      if (f.tipo === 'compra' && negativa($('#fc').value, cant * precio / div, f.moneda)) return;
      if (!activoId) {
        let banco = $('#fb').value;
        if (banco === '__otro') banco = $('#fbo').value.trim();
        if (!banco) return fallo('Indicá el banco.');
        const r = await post('crearActivo', { banco, opcion: f.opcion });
        activoId = r.id; S.activos = null;
      }
      const p = S.dash.posiciones.find(x => x.id === activoId);
      if (f.tipo === 'venta' && p && cant > p.cantidad + 1e-9) return fallo('Estás vendiendo más de lo que tenés.');
      const moneda = p ? p.moneda : f.opcion.moneda;
      mov = { tipo: f.tipo === 'compra' ? 'COMPRA' : 'VENTA', activo_id: activoId, cantidad: cant, precio, moneda, tc,
              contra_activo: $('#fc').value || '', fecha: fechaV };
    }
    const r = await post('movimiento', mov);
    cerrar();
    toast('Guardado', r.id);
    refrescar(true);
  } catch (e) { fallo(e.message || 'No se pudo guardar.'); }
}

/* ================= Bloqueo (Face ID / huella / PIN) ================= */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function sha(t) { const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('pat:' + t)); return b64(h); }
const bioDisponible = async () => !!(window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(() => false));

async function crearBio() {
  const cred = await navigator.credentials.create({ publicKey: {
    challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: 'Patrimonio' },
    user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'patrimonio', displayName: (S.dash && S.dash.nombre) || 'Patrimonio' },
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' }, timeout: 60000 } });
  const id = b64(cred.rawId);
  // Se prueba la llave antes de activar el bloqueo: si el teléfono la guardó en otro lado
  // (otro gestor de contraseñas, llavero apagado) no se puede usar y dejaría la app trabada.
  try { await verificarBio(id); } catch (e) { const er = new Error('prueba'); er.prueba = true; throw er; }
  S.lock = { tipo: 'bio', id }; save('lock', S.lock);
}
async function verificarBio(id) {
  await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)),
    allowCredentials: [{ type: 'public-key', id: unb64(id) }], userVerification: 'required', timeout: 60000 } });
}

function pantallaBloqueo() {
  document.getElementById('nav').hidden = true;
  S.pin = '';
  const esBio = S.lock.tipo === 'bio';
  app.innerHTML = `<div class="center" style="text-align:center"><div class="h1">Patrimonio</div>
    ${esBio ? `<p class="m">Desbloqueá con Face ID o huella.</p><button class="btn" id="ub">Desbloquear</button><div id="lerr"></div>`
      : `<p class="m">Ingresá tu PIN</p><div class="pin">${'<i></i>'.repeat(4)}</div>
         <div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k => k === '' ? '<span></span>' : `<button data-k="${k}" aria-label="${k === '⌫' ? 'Borrar' : k}">${k}</button>`).join('')}</div><div id="lerr"></div>`}
    <button class="lnk" data-act="sinDesbloqueo" style="margin-top:28px">¿No podés desbloquear?</button></div>`;
  if (esBio) {
    const go = async () => { try { await verificarBio(S.lock.id); desbloquear(); } catch (e) {
      $('#lerr').innerHTML = '<div class="err">No se pudo verificar. Tocá Desbloquear para reintentar. Si el teléfono dice que no hay llaves guardadas, usá «¿No podés desbloquear?».</div>'; } };
    $('#ub').onclick = go; go();
  } else {
    app.querySelectorAll('[data-k]').forEach(b => b.onclick = async () => {
      const k = b.dataset.k;
      S.pin = k === '⌫' ? S.pin.slice(0, -1) : (S.pin + k).slice(0, 4);
      app.querySelectorAll('.pin i').forEach((el, i) => el.classList.toggle('f', i < S.pin.length));
      if (S.pin.length === 4) {
        if (await sha(S.pin) === S.lock.hash) desbloquear();
        else { $('#lerr').innerHTML = '<div class="err">PIN incorrecto.</div>'; S.pin = ''; setTimeout(() => app.querySelectorAll('.pin i').forEach(el => el.classList.remove('f')), 300); }
      }
    });
  }
}

/* ================= Render y eventos ================= */
function render() {
  if (!S.cfg && !S.demo) return pantallaConexion();
  if (S.bloqueado) return pantallaBloqueo();
  const nav = document.getElementById('nav');
  if (!S.dash) { nav.hidden = true; app.innerHTML = `<div class="center" style="text-align:center">${S.error ? `<p class="err">${esc(S.error)}</p><button class="btn" data-act="refrescar">Reintentar</button>` : '<span class="spin"></span>'}</div>`; return; }
  nav.hidden = false;
  nav.querySelectorAll('.tb').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  const v = { hoy: vHoy, cartera: vCartera, bonos: vBonos, evolucion: vEvolucion }[S.tab];
  app.innerHTML = '<div class="wrap">' + v() + '</div>';
}

document.addEventListener('click', async e => {
  const t = e.target.closest('button');
  if (!t) return;
  const ds = t.dataset;
  if (ds.tab) { S.tab = ds.tab; render(); window.scrollTo(0, 0); return; }
  if (ds.mon) { S.moneda = ds.mon; save('moneda', S.moneda); render(); return; }
  if (ds.grupo) { S.cartGrupo = ds.grupo; render(); return; }
  if (ds.orden) { S.cartOrden = ds.orden; render(); return; }
  if (ds.per) { S.evoPeriodo = ds.per; render(); return; }
  if (ds.det) { detalle(ds.det); return; }
  if (ds.concil) { conciliacion(ds.concil); return; }
  if (ds.flujo) { flujo(ds.flujo, ds.id); return; }
  if (ds.elegir) { S.flujo.id = ds.elegir; pasoDatos(); return; }
  if (ds.opcion) {
    const o = S.flujo.opciones[+ds.opcion];
    const ya = (S.activos || []).find(a => a.id && S.dash.posiciones.some(p => p.id === a.id && p.ticker === o.ticker));
    if (ya) S.flujo.id = ya.id; else S.flujo.opcion = o;
    pasoDatos(); return;
  }
  if (ds.caja) { S.flujo.caja = ds.caja; t.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === t)); return; }
  if (ds.borrar) {
    if (!confirm('¿Borrar este movimiento? Se recalcula todo sin él.')) return;
    try { await post('borrarMovimiento', { id: ds.borrar }); cerrar(); toast('Movimiento borrado'); refrescar(true); } catch (er) { toast(er.message); }
    return;
  }
  switch (ds.act) {
    case 'ocultar': S.ocultar = !S.ocultar; save('ocultar', S.ocultar); render(); break;
    case 'refrescar': refrescar(); break;
    case 'moneda': S.moneda = S.moneda === 'USD' ? 'ARS' : 'USD'; save('moneda', S.moneda); render(); break;
    case 'ajustes': ajustes(); break;
    case 'leidos': S.avisos.forEach(a => a.leido = true); render(); post('leerAvisos', {}).catch(() => {}); break;
    case 'buscar': buscar(); break;
    case 'guardar': guardar(t); break;
    case 'guardarIgual': S.flujo.forzar = true; guardar($('#sheetBody [data-act=guardar]')); break;
    case 'conciliar': {
      const saldo = numSuelto($('#cs').value);
      if (!(saldo >= 0)) { $('#cres').innerHTML = '<div class="err">Ingresá el saldo.</div>'; return; }
      t.innerHTML = '<span class="spin"></span>';
      try {
        const r = await post('conciliar', { banco: ds.banco, saldo, moneda: $('#cm').value });
        $('#cres').innerHTML = r.ok ? `<p class="up" style="margin-top:14px">Coincide. Diferencia de ${money(r.diferenciaUsd, { moneda: 'USD' })}.</p>`
          : `<p class="dn" style="margin-top:14px">No coincide: el banco muestra ${money(r.diferenciaUsd, { moneda: 'USD', signo: true })} respecto de la app. Revisá si falta registrar algún movimiento o si un precio está desactualizado.</p>`;
      } catch (er) { $('#cres').innerHTML = `<div class="err">${esc(er.message)}</div>`; }
      t.textContent = 'Comparar'; break;
    }
    case 'bloquear': cerrar(); if (S.lock) { S.bloqueado = true; render(); } else configurarBloqueo(); break;
    case 'cambiarBloqueo': configurarBloqueo(); break;
    case 'lockBio': try { await crearBio(); cerrar(); toast('Face ID o huella activado'); } catch (er) {
      $('#berr').innerHTML = er.prueba
        ? '<div class="err">El Face ID no quedó guardado en este teléfono (pasa si las llaves se guardan en otro gestor, como Chrome). Usá un PIN.</div>'
        : '<div class="err">No se pudo activar. Probá con un PIN.</div>'; } break;
    case 'lockPin': crearPin(); break;
    case 'guardarPin': {
      const a = $('#pn').value, b = $('#pn2').value;
      if (!/^\d{4}$/.test(a)) { $('#berr').innerHTML = '<div class="err">El PIN tiene que tener 4 números.</div>'; return; }
      if (a !== b) { $('#berr').innerHTML = '<div class="err">Los PIN no coinciden.</div>'; return; }
      S.lock = { tipo: 'pin', hash: await sha(a) }; save('lock', S.lock); cerrar(); toast('PIN activado'); break;
    }
    case 'lockNo': S.lock = null; save('lock', null); cerrar(); break;
    case 'sinDesbloqueo':
      if (!confirm('Se desconecta este dispositivo: se borran la clave, el bloqueo y la copia guardada acá. Tus datos siguen en la planilla. Para volver a entrar vas a necesitar la dirección y la clave.')) return;
      Object.keys(localStorage).filter(k => k.startsWith(LS)).forEach(k => localStorage.removeItem(k));
      location.reload(); break;
    case 'desconectar':
      if (!confirm('¿Desconectar este dispositivo? Vas a tener que volver a cargar la clave.')) return;
      Object.keys(localStorage).filter(k => k.startsWith(LS)).forEach(k => localStorage.removeItem(k));
      location.reload(); break;
    case 'salirDemo': localStorage.removeItem(LS + 'demo'); location.reload(); break;
  }
});
$('#plus').onclick = () => { if (S.dash) menuMas(); };

/* Se bloquea al volver después de 3 minutos en segundo plano */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) S.oculto = Date.now();
  else if (S.oculto && Date.now() - S.oculto > 180000 && S.lock) { cerrar(); S.bloqueado = true; render(); }
  else if (S.oculto && Date.now() - S.oculto > 60000 && !S.bloqueado) refrescar(true);
});

/* ================= Datos de ejemplo ================= */
const DEMO = (() => {
  const hoy = hoyISO();
  const suma = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const mep = 1285;
  const P = [
    ['UST30', 'Treasury Note 4,25% 2030', 'BONO', 'IDB New York', 'EE.UU.', 'USD', 200000, 99.1, 0.08, 198200, 197000],
    ['CASH_IDB', 'Cuenta IDB', 'CASH', 'IDB New York', 'EE.UU.', 'USD', 185000, 1, 0, 185000, 185000],
    ['SPY', 'SPDR S&P 500 ETF', 'ACCION', 'IDB New York', 'EE.UU.', 'USD', 260, 655, 0.9, 170300, 150000],
    ['GD30', 'Global 2030', 'BONO', 'Galicia', 'Argentina', 'USD', 250000, 61.2, -0.3, 153000, 141000],
    ['ORO', 'Oro físico', 'ORO', 'Oro físico', 'Físico', 'USD', 46.92, 3710, -0.4, 174073, 0],
    ['MELI', 'CEDEAR Mercado Libre', 'CEDEAR', 'Galicia', 'Argentina', 'ARS', 3200, 27500, 2.1, 68482, 62000],
    ['CASH_GAL_USD', 'Cuenta dólares Galicia', 'CASH', 'Galicia', 'Argentina', 'USD', 42000, 1, 0, 42000, 42000],
    ['CASH_GAL_ARS', 'Cuenta pesos Galicia', 'CASH', 'Galicia', 'Argentina', 'ARS', 18000000, 1, 0, 14008, 14000],
    ['EFE', 'Efectivo dólares', 'EFECTIVO', 'Casa', 'Argentina', 'USD', 25000, 1, 0, 25000, 25000]
  ].map(([id, nombre, tipo, banco, pais, moneda, cantidad, precio, varPct, valorUsd, costoUsd]) => {
    const varDiaUsd = +(valorUsd - valorUsd / (1 + varPct / 100)).toFixed(2) + (moneda === 'ARS' ? -valorUsd * 0.004 : 0);
    return { id, nombre, tipo, banco, pais, moneda, cantidad, precio, varPct, valorUsd, costoUsd, varDiaUsd: +varDiaUsd.toFixed(2),
      gananciaUsd: costoUsd ? +(valorUsd - costoUsd).toFixed(2) : null, gananciaPct: costoUsd ? +((valorUsd / costoUsd - 1) * 100).toFixed(2) : null,
      estadoPrecio: 'ok', actualizado: new Date().toISOString(), ticker: { SPY: 'SPY', GD30: 'GD30D', MELI: 'MELI' }[id] || '' };
  });
  const total = P.reduce((s, p) => s + p.valorUsd, 0);
  P.forEach(p => p.pesoPct = +(p.valorUsd / total * 100).toFixed(2));
  P.find(p => p.id === 'ORO').piezas = [
    { pieza: 'Krugerrand', cantidad: 9, gramosFinos: 279.93, onzas: 9, valorUsd: 33390, nota: '' },
    { pieza: 'USA 20 dólares Double Eagle', cantidad: 6, gramosFinos: 180.56, onzas: 5.805, valorUsd: 21537, nota: '' },
    { pieza: 'Lingote 10 g', cantidad: 14, gramosFinos: 140, onzas: 4.501, valorUsd: 16699, nota: '' }];
  const grupo = k => { const g = {}; P.forEach(p => g[p[k]] = (g[p[k]] || 0) + p.valorUsd);
    return Object.keys(g).map(n => ({ nombre: n, usd: g[n], pct: +(g[n] / total * 100).toFixed(2) })).sort((a, b) => b.usd - a.usd); };
  const efP = P.reduce((s, p) => s + (p.moneda === 'ARS' ? p.varDiaUsd + p.valorUsd * 0.004 : p.varDiaUsd), 0);
  const efF = P.filter(p => p.moneda === 'ARS').reduce((s, p) => s - p.valorUsd * 0.004, 0);
  // Próxima fecha (después de hoy) con ese mes y día
  const prox = (mes, dia, n = 0) => { let y = +hoy.slice(0, 4); let f;
    do { f = y + '-' + String(mes).padStart(2, '0') + '-' + String(dia).padStart(2, '0'); y++; } while (f <= hoy);
    return n ? (+f.slice(0, 4) + n) + f.slice(4) : f; };
  // Treasury: cupón semestral 15/5 y 15/11 (2,125% × 200.000). GD30: 8% de amortización y 0,75% anual
  // sobre el residual (250.000 VN originales, 64% residual desde julio 2026).
  const cobros = [
    { fecha: prox(11, 15), activo: 'Treasury Note 4,25% 2030', id: 'UST30', tipo: 'CUPON', usd: 4250 },
    { fecha: prox(1, 9), activo: 'Global 2030', id: 'GD30', tipo: 'AMORTIZACION', usd: 20000 },
    { fecha: prox(1, 9), activo: 'Global 2030', id: 'GD30', tipo: 'CUPON', usd: 600 },
    { fecha: prox(5, 15), activo: 'Treasury Note 4,25% 2030', id: 'UST30', tipo: 'CUPON', usd: 4250 },
    { fecha: prox(7, 9), activo: 'Global 2030', id: 'GD30', tipo: 'AMORTIZACION', usd: 20000 },
    { fecha: prox(7, 9), activo: 'Global 2030', id: 'GD30', tipo: 'CUPON', usd: 525 }].sort((a, b) => a.fecha < b.fecha ? -1 : 1);
  // En pesos: el dólar subió 0,4% en el día (mismo supuesto que el efecto dólar en USD)
  const mepAyer = mep / 1.004;
  const usdEnDolares = P.filter(p => p.moneda !== 'ARS').reduce((s, p) => s + p.valorUsd, 0);
  const diaArs = { efectoPrecio: efP * mep, efectoFx: usdEnDolares * (mep - mepAyer) };
  diaArs.varDia = diaArs.efectoPrecio + diaArs.efectoFx;
  diaArs.varDiaPct = diaArs.varDia / (total * mep - diaArs.varDia) * 100;
  const dash = () => ({
    nombre: 'Javier', hoy, generado: new Date().toISOString(),
    fx: { mep, ccl: 1302, oficial: 1250, referencia: 'MEP', estado: 'ok' },
    total: { usd: total, varDiaUsd: efP + efF, varDiaPct: (efP + efF) / total * 100, efectoPrecioUsd: efP, efectoFxUsd: efF,
             aportesNetosUsd: 1010000, resultadoUsd: total - 1010000, diaArs },
    rendimiento: rendDemo(),
    grupos: { banco: grupo('banco'), pais: grupo('pais'), tipo: grupo('tipo'), moneda: grupo('moneda') },
    posiciones: P, movers: P.filter(p => p.varDiaUsd).sort((a, b) => Math.abs(b.varDiaUsd) - Math.abs(a.varDiaUsd)).slice(0, 5),
    bonos: [
      { id: 'UST30', nombre: 'Treasury Note 4,25% 2030', vencimiento: '2030-05-15', diasAlVencimiento: 1328, cuponTna: 4.25, tirPct: 4.57, durationModificada: 3.21, pesoPct: P[0].pesoPct },
      { id: 'GD30', nombre: 'Global 2030', vencimiento: '2030-07-09', diasAlVencimiento: 1383, cuponTna: null, tirPct: 9.8, durationModificada: 1.9, pesoPct: P[3].pesoPct }],
    cobros, cobros12mUsd: cobros.reduce((s, c) => s + c.usd, 0), cobradoUltimos12mUsd: 47800,
    alertas: [{ nivel: 'aviso', tipo: 'concentracion', texto: 'Los bonos son el 29% de tu patrimonio' }]
  });
  // Serie fija (azar con semilla): el gráfico no cambia al recargar y los rendimientos salen de ella
  const serieDemo = (() => {
    let x = 7; const azar = () => (x = (x * 16807) % 2147483647) / 2147483647;
    const serie = []; let c = 100, s = 6200, m = 1150;
    for (let i = 400; i >= 0; i--) {
      c *= 1 + (Math.sin(i / 9) * 0.002 + 0.00035 + (azar() - 0.5) * 0.004);
      s *= 1 + (Math.sin(i / 7) * 0.003 + 0.0004 + (azar() - 0.5) * 0.008);
      m *= 1 + 0.0005 + (azar() - 0.5) * 0.003;
      serie.push({ fecha: suma(hoy, -i), cartera: c, spx: s, mep: m, usd: 0 });
    }
    return serie;
  })();
  function rendDemo() {
    const ult = serieDemo[serieDemo.length - 1].cartera;
    const desde = f => { const b = serieDemo.filter(p => p.fecha <= f).pop() || serieDemo[0]; return +((ult / b.cartera - 1) * 100).toFixed(2); };
    return { d7: desde(suma(hoy, -7)), d30: desde(suma(hoy, -30)), ytd: desde(hoy.slice(0, 4) + '-01-01'), inicio: desde('0000') };
  }
  const evo = () => ({ serie: serieDemo, rendimiento: rendDemo(), aportesNetosUsd: 1010000, resultadoUsd: total - 1010000 });
  const wait = v => new Promise(r => setTimeout(() => r(v), 350));
  return {
    dash,
    get: (a, p) => wait(a === 'dashboard' ? dash() : a === 'avisos' ? [{ id: 'a1', texto: 'Entró el dividendo de SPDR S&P 500 ETF: US$ 455 en Cuenta IDB.', leido: false }]
      : a === 'tc' ? { fecha: p.fecha, tc: p.fecha >= hoy ? mep : Math.round(mep * 0.97), referencia: 'MEP', fuente: 'ejemplo' }
      : a === 'evolucion' ? evo() : a === 'activos' ? P.map(x => ({ id: x.id, nombre: x.nombre, tipo: x.tipo, moneda: x.moneda, banco: x.banco }))
      : a === 'movimientos' ? [{ id: 'd1', fecha: '2026-09-01', tipo: 'COMPRA', activo_id: p.activo, cantidad: 100, precio: 98.5, origen: 'app' }]
      : a === 'buscar' ? { opciones: [{ nombre: String(p.q).toUpperCase(), tipo: 'ACCION', ticker: String(p.q).toUpperCase(), fuente: 'GOOGLEFINANCE', moneda: 'USD', divisor: 1, precio: 100, detalle: 'Ejemplo: en la versión real busca en los mercados' }] } : null),
    post: (a, d) => wait(a === 'conciliar' ? { ok: true, diferenciaUsd: 3 } : { ok: true, id: 'demo' + Date.now() })
  };
})();

/* ================= Inicio ================= */
if (S.demo) { S.dash = DEMO.dash(); S.cfg = S.cfg || { demo: true }; }
if (S.lock && !S.demo && S.cfg) S.bloqueado = true;
render();
if (S.cfg && !S.bloqueado) refrescar(true);
</script>
